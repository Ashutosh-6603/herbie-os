<!doctype html>
<html>
  <head>

    <meta http-equiv="Content-Security-Policy" content="default-src 'self'" />
    <title>Herbie</title>
    <link rel="stylesheet" href="styles.css" />
    <script src="renderer.js" defer></script>
  </head>

    <div class="bar">

      </div>
      <h1 class="status">Initializing...</h1>
    </div>
  </body>
